<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escala da Mídia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#111113">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Escala">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<section id="login" class="login hidden"></section>

<div id="app" class="app hidden">
  <aside class="side" id="side">
    <div class="side-user" id="sideUser"></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="brand-mini"><span class="dots4"><i></i><i></i><i></i><i></i></span><span id="brandMini">Escala</span></div>
      <button class="btn ghost sm" data-act="sair">Sair</button>
    </div>
  </aside>
  <button class="scrim" id="scrim" data-act="menu" aria-label="Fechar menu"></button>
  <div class="main">
    <header class="top">
      <button class="hamb" data-act="menu" aria-label="Abrir menu">☰</button>
      <h1 id="pageTitle"></h1>
      <span class="demo-tag hidden" id="demoTag">DEMONSTRAÇÃO</span>
      <div class="top-actions" id="topActions"></div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>

<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<div id="toast" class="toast" role="status"></div>

<script type="module" src="app.js"></script>
</body>
</html>
